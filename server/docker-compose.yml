services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: remi
      MYSQL_USER: remi
      MYSQL_PASSWORD: remi
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - remi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uremi", "-premi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - remi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "remi:remi@tcp(mysql:3306)/remi?parseTime=true&charset=utf8mb4"
      REDIS_ADDR: "redis:6379"
      AUTH_MODE: "dev"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  remi_mysql_data:
  remi_redis_data:
